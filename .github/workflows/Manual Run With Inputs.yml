name: Manual Trigger

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'testing'
        type: choice
        options:
          - production
          - testing
          - prodod
          - release

      version:
        description: 'Version to deploy (e.g. 1.4.0)'
        required: false
        default: 'latest'
        type: string

      dry_run:
        description: 'Only simulate, do not actually deploy'
        required: false
        default: 'true'
        type: string

jobs:
  manual-job:
    runs-on: ubuntu-latest

    steps:
      - name: Show the inputs the user selected
        run: |
          echo "Environment : ${{ inputs.environment }}"
          echo "Version     : ${{ inputs.version }}"
          echo "Dry run?    : ${{ inputs.dry_run }}"
